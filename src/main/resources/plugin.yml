name: SkinPatchVH
version: '${project.version}'
main: me.v0rham.skinPatchVH.Main
api-version: '1.18'
authors: [ V0rHaM ]

commands:
  skin:
    description: Установить скин по нику
    usage: /skin <ник> | reset
    permission: skinpatchvh.use

permissions:
  skinpatchvh.use:
    description: Доступ к команде /skin
    default: true
  skinpatchvh.update:
    description: Уведомления о новой версии плагина
    default: op
